<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METRONOME | Précision Timing</title>
    <style>
        /* --- DESIGN SYSTEM (Charte Sombre) --- */
        :root {
            --bg-color: #121214;
            --panel-color: #1e1e24;
            --text-main: #e0e0e0;
            --accent-color: #00d4ff; 
            --accent-glow: 0 0 20px rgba(0, 212, 255, 0.6);
            --secondary: #ff9f1c; 
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Prend toute la hauteur */
            height: 100dvh; /* Fix pour Safari Mobile */
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Enlève le flash bleu sur mobile */
        }

        /* --- LE TITRE --- */
        .main-title {
            font-size: clamp(30px, 8vw, 42px); /* ÉLASTIQUE : min 30px, idéal 8% écran, max 42px */
            font-weight: 900;
            color: var(--accent-color);
            text-shadow: var(--accent-glow);
            margin: 0 0 20px 0;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
        }

        /* --- LE CŒUR : LE MÉTRONOME --- */
        .metronome-wrapper {
            text-align: center;
            background: var(--panel-color);
            
            /* ÉLASTICITÉ ICI 👇 */
            width: 85%;            /* Prend 85% de la largeur du téléphone */
            max-width: 350px;      /* Mais ne dépasse jamais 350px sur PC */
            padding: 30px 20px;    /* Marges internes réduites pour mobile */
            
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            box-sizing: border-box; /* Important pour les calculs de largeur */
        }

        .bpm-display {
            font-size: clamp(60px, 20vw, 80px); /* Le texte grossit avec l'écran */
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0;
            cursor: ns-resize;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            line-height: 1; /* Évite les espacements verticaux bizarres */
        }

        .bpm-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
        }

        /* Les contrôles */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
        }

        button {
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
            outline: none;
            touch-action: manipulation; /* Optimisation tactile */
        }

        button:active { transform: scale(0.95); }

        .btn-main {
            width: 70px; /* Un peu plus petit pour mobile */
            height: 70px;
            border-radius: 50%;
            background: var(--text-main);
            color: var(--bg-color);
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(255,255,255,0.1);
        }

        .btn-tap {
            background: transparent;
            border: 2px solid #444;
            color: #888;
            padding: 12px 20px; /* Zone de touche plus confortable */
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-tap:hover { border-color: var(--secondary); color: var(--secondary); }

        /* Settings rapides */
        .settings-row {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }
        
        .setting-item { display: flex; flex-direction: column; align-items: flex-start; }
        .setting-label { font-size: 10px; color: #666; margin-bottom: 5px; }
        
        select { 
            background: #111; 
            color: white; 
            border: 1px solid #444; 
            padding: 8px; /* Plus facile à toucher au doigt */
            border-radius: 6px; 
            font-size: 14px;
        }

        /* --- MARKETING --- */
        .promo-bar {
            position: absolute;
            bottom: 20px; /* Plus bas pour laisser de la place */
            width: 90%;
            max-width: 400px;
            
            background: linear-gradient(90deg, #1e1e24, #25252b);
            padding: 12px 20px;
            border-radius: 50px;
            
            display: flex;
            align-items: center;
            justify-content: space-between; /* Espace le texte et le bouton */
            gap: 10px;
            
            border: 1px solid #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            text-decoration: none;
            box-sizing: border-box;
        }

        .promo-text { 
            font-size: 12px; /* Un peu plus petit sur mobile */
            color: #ccc; 
            line-height: 1.3;
            text-align: left;
        }
        .promo-text strong { color: white; display: block; } /* Le nom du produit passe à la ligne si besoin */

        .btn-promo {
            background: var(--accent-color);
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 11px;
            white-space: nowrap; /* Empêche le bouton de se casser en deux lignes */
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }

        /* Visualizer */
        .visual-beat {
            width: 12px; height: 12px;
            background: #444;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            transition: background 0.05s;
        }

        /* --- MEDIA QUERIES (Ajustements spécifiques pour très petits écrans) --- */
        @media (max-width: 380px) {
            .metronome-wrapper { padding: 25px 15px; }
            .bpm-display { font-size: 60px; }
            .btn-main { width: 60px; height: 60px; font-size: 24px; }
            .main-title { font-size: 28px; margin-bottom: 15px; }
            .promo-bar { bottom: 10px; padding: 10px 15px; }
        }
        
        /* Mode Paysage Mobile (Écran plat) */
        @media (max-height: 500px) {
            .main-title { display: none; } /* On cache le titre pour gagner de la place */
            .promo-bar { position: static; margin-top: 15px; width: auto; border-radius: 10px; }
            body { height: auto; padding: 20px 0; overflow-y: auto; }
        }

    </style>
</head>
<body>

    <h1 class="main-title">METRONOME</h1>

    <div class="metronome-wrapper">
        <div class="visual-beat" id="beat-led"></div>
        
        <div class="bpm-label">TEMPO</div>
        <div class="bpm-display" id="bpm-val">120</div>
        
        <div class="controls">
            <button class="btn-tap" id="btn-tap">TAP</button>
            <button class="btn-main" id="btn-play">▶</button>
        </div>

        <div class="settings-row">
            <div class="setting-item">
                <span class="setting-label">MESURE</span>
                <select id="time-sig">
                    <option value="4">4 / 4</option>
                    <option value="3">3 / 4</option>
                    <option value="1">1 / 4</option>
                </select>
            </div>
            <div class="setting-item">
                <span class="setting-label">SON</span>
                <select id="sound-type">
                    <option value="click">Digital</option>
                    <option value="wood">Wood</option>
                </select>
            </div>
        </div>
    </div>

    <div class="promo-bar">
        <div class="promo-text">
            Plus de puissance ?<br>
            <strong>HARDBEAT PRO</strong>
        </div>
        <a href="https://hardbeat-pro.binokub.com/" class="btn-promo">STUDIO/a>
    </div>

    <script src="app.js"></script>

</body>
</html>
