<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METRO-ZEN | Précision Timing</title>
    <style>
        /* --- DESIGN SYSTEM (Charte Sombre) --- */
        :root {
            --bg-color: #121214;
            --panel-color: #1e1e24;
            --text-main: #e0e0e0;
            --accent-color: #00d4ff; /* Cyan Hardbeat */
            --accent-glow: 0 0 15px rgba(0, 212, 255, 0.4);
            --secondary: #ff9f1c; /* Orange pour le contraste */
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- LE CŒUR : LE MÉTRONOME --- */
        .metronome-wrapper {
            text-align: center;
            background: var(--panel-color);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 300px;
        }

        /* L'affichage BPM géant */
        .bpm-display {
            font-size: 80px;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: var(--accent-glow);
            margin: 10px 0;
            cursor: ns-resize; /* Indique qu'on peut glisser */
            user-select: none;
        }

        .bpm-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
        }

        /* Les contrôles */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }

        .btn-main {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--text-main);
            color: var(--bg-color);
            font-size: 30px; /* Icone Play */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(255,255,255,0.1);
        }

        .btn-tap {
            background: transparent;
            border: 2px solid #444;
            color: #888;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-tap:hover { border-color: var(--secondary); color: var(--secondary); }

        /* Settings rapides */
        .settings-row {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }
        
        .setting-item { display: flex; flex-direction: column; align-items: flex-start; }
        .setting-label { font-size: 10px; color: #666; margin-bottom: 5px; }
        select { background: #111; color: white; border: 1px solid #444; padding: 5px; border-radius: 4px; }

        /* --- LA PUB INTELLIGENTE (SOFT MARKETING) --- */
        .promo-bar {
            position: absolute;
            bottom: 30px;
            background: linear-gradient(90deg, #1e1e24, #25252b);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .promo-bar:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .promo-text {
            font-size: 14px;
            color: #ccc;
        }
        
        .promo-text strong { color: white; }

        .btn-promo {
            background: var(--accent-color);
            color: #000;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            box-shadow: var(--accent-glow);
        }

        /* Visualizer (La boule qui pulse) */
        .visual-beat {
            width: 10px; height: 10px;
            background: #444;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            transition: background 0.05s;
        }
        .visual-beat.active { background: var(--secondary); box-shadow: 0 0 10px var(--secondary); }

    </style>
</head>
<body>

    <div class="metronome-wrapper">
        <div class="visual-beat" id="beat-led"></div>
        
        <div class="bpm-label">TEMPO</div>
        <div class="bpm-display" id="bpm-val">120</div>
        
        <div class="controls">
            <button class="btn-tap" id="btn-tap">TAP</button>
            <button class="btn-main" id="btn-play">▶</button>
        </div>

        <div class="settings-row">
            <div class="setting-item">
                <span class="setting-label">MESURE</span>
                <select id="time-sig">
                    <option value="4">4 / 4</option>
                    <option value="3">3 / 4</option>
                    <option value="1">1 / 4</option>
                </select>
            </div>
            <div class="setting-item">
                <span class="setting-label">SON</span>
                <select id="sound-type">
                    <option value="click">Digital</option>
                    <option value="wood">Wood</option>
                </select>
            </div>
        </div>
    </div>

    <div class="promo-bar">
        <div class="promo-text">
            Besoin de plus qu'un clic ? <br>
            Découvrez <strong>HARDBEAT PRO</strong>
        </div>
        <a href="HARDBEAT-PRO.html" class="btn-promo">OUVRIR LE STUDIO 🎹</a>
    </div>

    <script>
        // --- LOGIQUE UI SIMPLE (Juste pour tester les boutons) ---
        // Le vrai moteur audio viendra après
        
        let isPlaying = false;
        const playBtn = document.getElementById('btn-play');
        const beatLed = document.getElementById('beat-led');

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.innerText = isPlaying ? "◼" : "▶"; // Change l'icône
            playBtn.style.background = isPlaying ? "#ff4757" : "#e0e0e0"; // Rouge si Stop
            
            // Simulation visuelle juste pour l'effet "Waoo"
            if(isPlaying) startFakePulse();
        });

        function startFakePulse() {
            if(!isPlaying) return;
            beatLed.classList.add('active');
            setTimeout(() => beatLed.classList.remove('active'), 100);
            setTimeout(startFakePulse, 500); // 120 BPM approx
        }
        
        // Petit effet sur le BPM (Drag & Drop simulé)
        // Ici on mettra la vraie logique plus tard
    </script>

</body>
</html>
